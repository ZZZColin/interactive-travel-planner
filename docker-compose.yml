services:
  trippath:
    build:
      context: .
      dockerfile: Dockerfile
    image: trippath:local
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      # 没有这两个变量，容器里的数据库是空的，谁都登录不进去——
      # ensureBootstrapAdmin() 只在数据库为空且这两个变量都存在时才会自动建管理员账号。
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-please
      ALLOW_SIGNUP: "false"
      COOKIE_SECURE: "false"
    volumes:
      # 把数据库文件放在 compose 文件旁边的 ./data 文件夹里（会自动创建），
      # 而不是用 Docker 匿名管理的 named volume——这样你能直接在文件管理器里
      # 找到 trippath.db，方便备份或者删了重来。
      - ./data:/data
