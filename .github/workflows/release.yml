name: 桌面版发布

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    name: 发布 ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            arch: x64
            rust-targets: ''
            args: ''
          - platform: ubuntu-22.04
            arch: x64
            rust-targets: ''
            args: ''
          - platform: macos-latest
            arch: arm64
            rust-targets: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            arch: x64
            rust-targets: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm type-check

      - name: 构建并发布 Tauri 安装包
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: TripPath v__VERSION__
          releaseBody: |
            TripPath 桌面版安装包。

            - Windows：下载 `.msi` / `.exe` 安装包，或下载无需安装的 `-portable.exe` 可移植版
            - macOS：下载对应架构的 `.dmg`
            - Linux：下载 `.AppImage` 或 `.deb`

            当前版本不包含任何 API Key；地图、天气和 AI 服务凭据需要在应用内配置。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

  publish-portable:
    name: 发布 Windows x64 可移植版
    needs: publish-tauri
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm type-check

      - name: 构建并发布可移植版
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: TripPath v__VERSION__
          releaseDraft: false
          prerelease: false
          args: '--no-bundle'
          uploadPlainBinary: true
          releaseAssetNamePattern: 'TripPath-[version]-[platform]-[arch]-portable[ext]'
