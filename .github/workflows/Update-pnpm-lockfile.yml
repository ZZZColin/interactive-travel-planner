name: Update pnpm lockfile

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.0 --activate

      - name: Regenerate pnpm-lock.yaml
        run: pnpm install --lockfile-only

      - name: Commit and push if the lockfile changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml 没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm-lock.yaml"
          git push
