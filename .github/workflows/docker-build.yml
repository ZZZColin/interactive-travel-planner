name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (loaded locally, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trippath:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name trippath-ci -p 8080:80 trippath:ci
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/ > /tmp/response.html; then
              break
            fi
            sleep 1
          done
          if ! grep -qi "TripPath\|<div id=\"app\">" /tmp/response.html; then
            echo "Container did not serve the expected page:"
            docker logs trippath-ci
            exit 1
          fi
          echo "Container served content successfully."

      - name: Stop container
        if: always()
        run: docker rm -f trippath-ci || true
